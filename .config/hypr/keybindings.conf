# ════════════════════════════════════════════════════════════════════════════
#  ~/.config/hypr/keybindings.conf
#  Ryan M Sullivan · Vim-driven Hyprland keybindings
#
#  Source this from hyprland.conf:
#    source = ~/.config/hypr/keybindings.conf
#
#  Bind type reference:
#    bindd   — fire once on press + human description
#    bindeld — fire + repeat while held + lock-screen-safe + description
#    bindld  — fire once + lock-screen-safe + description
#    bindmd  — mouse button bind + description
#
#  Navigation model (consistent hjkl at every scope):
#    Ctrl+hjkl   → nvim splits ↔ tmux panes  (vim-tmux-navigator, transparent)
#    Super+hjkl  → Hyprland compositor window focus
#    Super+Shift → Hyprland window swap
#    Super+Alt   → Hyprland window resize
#    Alt+hjkl    → Ghostty pane navigation
# ════════════════════════════════════════════════════════════════════════════

$mainMod = SUPER

# Screenshot output dir (timestamped filenames, consistent location)
$shotDir  = ~/pictures/screenshots
$shotFile = $shotDir/$(date +%Y-%m-%d_%H-%M-%S).png


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# APPS & LAUNCHERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

bindd = $mainMod,       return, Open terminal,              exec, uwsm app -- $terminal
bindd = $mainMod,       R,      App launcher (bemenu),      exec, $menu
bindd = $mainMod SHIFT, R,      Nvidia GPU menu,            exec, $nmenu
bindd = $mainMod,       E,      File manager (yazi),        exec, $fileManager

# Note / todo quick capture (opens nvim in ghostty with bemenu prompt for name)
bindd = $mainMod CTRL, N, New note (nvim),                  exec, ghostty --command="nvim ~/documents/.bc/batcave/Notes/'$(bemenu-input).md'"
bindd = $mainMod CTRL, T, New todo (nvim),                  exec, ghostty --command="nvim ~/documents/.bc/batcave/TODO/'$(bemenu-input)-todo.md'"

# Markdown notification scripts
bindd = $mainMod,       T, Markdown notify all,             exec, MarkdownToColorNotifyAll.sh
bindd = $mainMod SHIFT, T, Markdown notify,                 exec, MarkdownToColorNotify.sh

# Keybind viewer — bemenu-native, no external deps
# Requires: hyprctl, jq, bemenu  |  install script at ~/.local/bin/myBin/menu/bemenu-keybinds
bindd = $mainMod, SLASH, Show keybindings,                  exec, $HOME/.local/bin/myBin/menu/bemenu-keybinds

# Focus-or-launch pattern (idempotent: focuses existing window or spawns new)
# Uncomment and adapt class names as needed:
# bindd = $mainMod SHIFT, B, Browser (focus or launch),    exec, hyprctl dispatch focuswindow class:floorp || uwsm app -- floorp


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# WINDOW MANAGEMENT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

bindd = $mainMod,       X, Kill active window,              killactive,
bindd = $mainMod SHIFT, X, Kill active window (alt),        killactive,
bindd = $mainMod,       F, Toggle floating,                 togglefloating,
bindd = $mainMod SHIFT, F, Fullscreen,                      fullscreen,
bindd = $mainMod,       M, Maximize / monocle,              fullscreen, 1
bindd = $mainMod,       N, Toggle notification center,      exec, swaync-client -t


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STATUS BAR (eww)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

bindd = $mainMod SHIFT, SPACE, Toggle eww bar,              exec, eww close bar 2>/dev/null || eww open bar


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# LAYOUT & TILING (dwindle)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

bindd = $mainMod,      P,    Pseudo tile,                   pseudo,
bindd = $mainMod CTRL, S,    Toggle split direction,        layoutmsg, togglesplit


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# FOCUS NAVIGATION
#
# Layers (non-overlapping scopes):
#   Ctrl+hjkl  → nvim splits ↔ tmux panes via vim-tmux-navigator
#   Super+hjkl → Hyprland compositor window focus  (this section)
#   Arrow keys → Hyprland fallback (for apps that grab hjkl)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

bindd = $mainMod, H, Move focus left,                       movefocus, l
bindd = $mainMod, J, Move focus down,                       movefocus, d
bindd = $mainMod, K, Move focus up,                         movefocus, u
bindd = $mainMod, L, Move focus right,                      movefocus, r

# Arrow fallback (coexists with hjkl, no conflict)
bindd = $mainMod, left,  Move focus left (arrow),           movefocus, l
bindd = $mainMod, right, Move focus right (arrow),          movefocus, r
bindd = $mainMod, up,    Move focus up (arrow),             movefocus, u
bindd = $mainMod, down,  Move focus down (arrow),           movefocus, d


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# WINDOW SWAP
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

bindd = $mainMod SHIFT, H, Swap window left,                swapwindow, l
bindd = $mainMod SHIFT, J, Swap window down,                swapwindow, d
bindd = $mainMod SHIFT, K, Swap window up,                  swapwindow, u
bindd = $mainMod SHIFT, L, Swap window right,               swapwindow, r


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# RESIZE — Super+Alt+hjkl
# (consistent with focus=Super, shift=swap, alt=resize mnemonic)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

bindd = $mainMod ALT, H, Resize window left,                resizeactive, -50   0
bindd = $mainMod ALT, L, Resize window right,               resizeactive,  50   0
bindd = $mainMod ALT, K, Resize window up,                  resizeactive,   0 -50
bindd = $mainMod ALT, J, Resize window down,                resizeactive,   0  50


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# WORKSPACES
#
# Three workspace move behaviors:
#   Super+1-9       → switch to workspace
#   Super+Shift+1-9 → move window to workspace AND follow it
#   Super+Ctrl+1-9  → throw window to workspace silently (stay put)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Switch to workspace
bindd = $mainMod, 1, Switch to workspace 1,                 workspace, 1
bindd = $mainMod, 2, Switch to workspace 2,                 workspace, 2
bindd = $mainMod, 3, Switch to workspace 3,                 workspace, 3
bindd = $mainMod, 4, Switch to workspace 4,                 workspace, 4
bindd = $mainMod, 5, Switch to workspace 5,                 workspace, 5
bindd = $mainMod, 6, Switch to workspace 6,                 workspace, 6
bindd = $mainMod, 7, Switch to workspace 7,                 workspace, 7
bindd = $mainMod, 8, Switch to workspace 8,                 workspace, 8
bindd = $mainMod, 9, Switch to workspace 9,                 workspace, 9
bindd = $mainMod, 0, Switch to workspace 10,                workspace, 10

# Move window to workspace and follow
bindd = $mainMod SHIFT, 1, Move window to workspace 1,      movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move window to workspace 2,      movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move window to workspace 3,      movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move window to workspace 4,      movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move window to workspace 5,      movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move window to workspace 6,      movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move window to workspace 7,      movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move window to workspace 8,      movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move window to workspace 9,      movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move window to workspace 10,     movetoworkspace, 10

# Throw window to workspace silently — stay on current workspace (CachyOS pattern)
bindd = $mainMod CTRL, 1, Throw window to workspace 1,      movetoworkspacesilent, 1
bindd = $mainMod CTRL, 2, Throw window to workspace 2,      movetoworkspacesilent, 2
bindd = $mainMod CTRL, 3, Throw window to workspace 3,      movetoworkspacesilent, 3
bindd = $mainMod CTRL, 4, Throw window to workspace 4,      movetoworkspacesilent, 4
bindd = $mainMod CTRL, 5, Throw window to workspace 5,      movetoworkspacesilent, 5
bindd = $mainMod CTRL, 6, Throw window to workspace 6,      movetoworkspacesilent, 6
bindd = $mainMod CTRL, 7, Throw window to workspace 7,      movetoworkspacesilent, 7
bindd = $mainMod CTRL, 8, Throw window to workspace 8,      movetoworkspacesilent, 8
bindd = $mainMod CTRL, 9, Throw window to workspace 9,      movetoworkspacesilent, 9
bindd = $mainMod CTRL, 0, Throw window to workspace 10,     movetoworkspacesilent, 10

# Scratchpad (special workspace)
bindd = $mainMod,       S, Toggle scratchpad,               togglespecialworkspace, magic
bindd = $mainMod SHIFT, S, Move window to scratchpad,       movetoworkspace, special:magic

# Scroll through workspaces with mouse wheel
bindd = $mainMod, mouse_down, Next workspace,               workspace, e+1
bindd = $mainMod, mouse_up,   Prev workspace,               workspace, e-1


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# MOUSE — window move & resize via drag
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

bindmd = $mainMod, mouse:272, Move window (LMB drag),       movewindow
bindmd = $mainMod, mouse:273, Resize window (RMB drag),     resizewindow


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SCREENSHOTS — grim + slurp pipeline
#
# Mnemonic: P = Picture
#   Super+Ctrl+P       → area select  → clipboard  (primary daily use)
#   Super+Ctrl+Shift+P → area select  → file       (save to ~/pictures/screenshots/)
#   Super+Shift+P      → full screen  → clipboard
#   Print              → full screen  → file
#   Super+Alt+P        → active window → clipboard
#   Super+Shift+G      → OnScreenToClip custom script
#
# Note: XCURSOR_SIZE=24 prevents slurp cursor from flickering on HiDPI
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

bindd = $mainMod CTRL,       P, Screenshot area → clipboard,        exec, grim -g "$(XCURSOR_SIZE=24 slurp)" - | wl-copy
bindd = $mainMod CTRL SHIFT, P, Screenshot area → file,             exec, mkdir -p $shotDir && grim -g "$(XCURSOR_SIZE=24 slurp)" $shotFile
bindd = $mainMod SHIFT,      P, Screenshot fullscreen → clipboard,  exec, grim - | wl-copy
bindd = ,                 Print, Screenshot fullscreen → file,       exec, mkdir -p $shotDir && grim $shotFile
bindd = $mainMod ALT,        P, Screenshot active window → clipboard, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | wl-copy
bindd = $mainMod SHIFT,      G, Screen clip (OnScreenToClip),       exec, $HOME/.local/bin/myBin/OnScreenToClip


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SYSTEM & HARDWARE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

bindd = $mainMod,       Escape, Lock screen,                exec, loginctl lock-session
bindd = $mainMod CTRL,  Escape, Suspend system,             exec, systemctl suspend
bindd = $mainMod SHIFT, Z,      Power menu,                 exec, $HOME/.local/bin/myBin/menu/bemenu_power "Poweroff?"
bindd = $mainMod CTRL,  Z,      Exit Hyprland,              exit,

# Battery charge threshold (TLP — laptop only)
bindd = $mainMod CTRL,  C, Battery charge limit ON,         exec, doas tlp setcharge BAT0 1
bindd = $mainMod SHIFT, C, Battery charge limit OFF,        exec, doas tlp setcharge BAT0 0

# Keyboard backlight — moved from Super+K (freed for movefocus up)
bindd = $mainMod CTRL, B, Keyboard backlight 50%,           exec, brightnessctl -d white:kbd_backlight s 50%

# Power profiles
bindd = $mainMod SHIFT, F1, Power profile: power-saver,     exec, powerprofilesctl set power-saver
bindd = $mainMod SHIFT, F2, Power profile: balanced,        exec, powerprofilesctl set balanced
bindd = $mainMod SHIFT, F3, Power profile: performance,     exec, powerprofilesctl set performance

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# MEDIA — XF86 hardware keys
#
# Routes through ~/.local/bin/myBin/media/osd which:
#   1. Calls swayosd-client (shows OSD overlay) if server is running
#   2. Falls back to raw wpctl / brightnessctl if server is down
#
# bindeld — hold-to-repeat + lock-screen-safe + description
# bindld  — fire-once + lock-screen-safe + description
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

$osd = $HOME/.local/bin/myBin/media/osd

bindeld = , XF86AudioRaiseVolume,  Volume up 5%,             exec, $osd vol-up
bindeld = , XF86AudioLowerVolume,  Volume down 5%,           exec, $osd vol-down
bindeld = , XF86AudioMute,         Mute audio toggle,        exec, $osd vol-mute
bindeld = , XF86AudioMicMute,      Mute microphone toggle,   exec, $osd mic-mute
bindeld = , XF86MonBrightnessUp,   Screen brightness +5%,    exec, $osd bright-up
bindeld = , XF86MonBrightnessDown, Screen brightness -5%,    exec, $osd bright-down
bindeld = , xf86poweroff,          Power menu (hw button),   exec, $pmenu "Do you want to poweroff?"

bindld  = , XF86AudioPlay,         Play / Pause,             exec, playerctl play-pause
bindld  = , XF86AudioPause,        Play / Pause,             exec, playerctl play-pause
bindld  = , XF86AudioNext,         Next track,               exec, playerctl next
bindld  = , XF86AudioPrev,         Previous track,           exec, playerctl previous

# Volume reset — still uses wpctl directly (swayOSD has no "set absolute" command)
bindd = $mainMod, V, Reset volume to 100%,                   exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 100%

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PENDING SUGGESTIONS (uncomment when ready)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Spell toggle    → already handled in nvim: <leader>us (Snacks) + F9 (CycleLang)
# Substitute all  → DO NOT add S=:%s//g — substitute.nvim owns S. Use <leader>sr (grug-far)
# Placeholder jumper → add to nvim keymaps.lua: map("n", "<leader><leader>", ":keepp /<++><CR>ca<")
# Format motion   → change in nvim keymaps.lua: Q = "gq" (replace current Q = "<nop>")
# Bookmarks       → uncomment 2 lines in ~/.config/zsh/.zshrc then run: shortcuts
# Zen mode        → add to nvim keymaps.lua: map("n","<leader>Z", function() Snacks.zen() end)
