# ~/.config/ccache/ccache.conf

# Heavy local compilation cache.
max_size = 50G

# Save disk space with minimal CPU overhead.
compression = true
compression_level = 1

# Keep cache in user cache dir.
# ccache already defaults to $XDG_CACHE_HOME/ccache when XDG_CACHE_HOME is set,
# otherwise ~/.cache/ccache on Linux, unless legacy ~/.ccache exists.
# cache_dir = $HOME/.cache/ccache

# Fast temporary files. Good if /tmp is tmpfs or fast local storage.
temporary_dir = /tmp/ccache-tmp

# More stable when compiler binaries are updated in place.
compiler_check = content

# Better hit rate when building the same source from different dirs.
base_dir = $HOME
hash_dir = false

# Safe-ish relaxation. Helps packages that embed __TIME__ / __DATE__.
sloppiness = time_macros
